<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeedbackPro — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/css/auth-redesign.css" />
  </head>
  <body class="auth-page" data-page="login">
    <div class="auth-bg-ambient">
      <div class="wave-top"></div>
      <div class="wave-bottom"></div>
      <div class="grid-dots"></div>
    </div>

    <main class="auth-page-wrapper">
      <div class="auth-box-card compact-form">
        <!-- Logo & Brand Header -->
        <div class="auth-box-header">
          <a href="/" class="brand-header-logo">
            <div class="brand-icon-box">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="13" width="4" height="8" rx="1.5" fill="white" />
                <rect x="10" y="8" width="4" height="13" rx="1.5" fill="white" />
                <rect x="17" y="3" width="4" height="18" rx="1.5" fill="white" />
              </svg>
            </div>
            <div class="brand-text-wrap" style="align-items: center;">
              <span class="brand-name">FeedbackPro</span>
            </div>
          </a>
          <span class="tagline">Customer Feedback &amp; Review Analytics</span>

          <h1 class="auth-title">Welcome Back!</h1>
          <p class="auth-subtitle">Login to your account</p>
        </div>

        <!-- Alert Container -->
        <div id="authAlertBox" style="display: none;"></div>

        <!-- Login Form -->
        <form id="redesignLoginForm" class="auth-form-body">
          <div class="input-field-group">
            <label for="loginEmail">Email address</label>
            <div class="input-with-icon-wrap">
              <i class="fa-regular fa-envelope input-leading-icon"></i>
              <input
                type="email"
                id="loginEmail"
                name="email"
                class="custom-auth-input"
                placeholder="admin@feedbackpro.io"
                value="admin@feedbackpro.io"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="input-field-group">
            <label for="loginPassword">Password</label>
            <div class="input-with-icon-wrap">
              <i class="fa-solid fa-lock input-leading-icon"></i>
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="custom-auth-input"
                placeholder="••••••••"
                value="admin123"
                required
                autocomplete="current-password"
              />
              <button type="button" class="input-trailing-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye-slash"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-auth-submit" id="loginSubmitBtn">
            <span>Log In</span>
          </button>

          <a href="#" class="forgot-pass-link" id="forgotPasswordBtn">Forgot password?</a>

          <div class="auth-or-divider">
            <span>OR</span>
          </div>

          <!-- Quick 1-Click Demo Logins -->
          <div class="auth-demo-grid">
            <button type="button" class="demo-login-btn" id="demoAdminBtn">
              <i class="fa-solid fa-shield-halved"></i>
              <span>Admin Demo Login</span>
            </button>
            <button type="button" class="demo-login-btn" id="demoCustomerBtn">
              <i class="fa-solid fa-user-check"></i>
              <span>Customer Portal Demo</span>
            </button>
          </div>
        </form>

        <div class="auth-card-footer">
          <span>Don't have an account?</span>
          <a href="/signup">Sign Up</a>
        </div>
      </div>
    </main>

    <script src="/js/storage.js"></script>
    <script src="/js/auth-redesign.js"></script>
  </body>
</html>
